<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg-window: #ececec;
    --bg-sidebar: rgba(245,245,247,0.8);
    --bg-main: #ffffff;
    --bg-card: #ffffff;
    --bg-hover: rgba(0,0,0,0.05);
    --bg-active: rgba(0,0,0,0.08);
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #aeaeb2;
    --border-color: rgba(0,0,0,0.1);
    --accent: #007aff;
    --accent-hover: #0066d6;
    --shadow-window: 0 20px 60px rgba(0,0,0,0.3);
    --green: #34c759;
    --orange: #ff9500;
    --red: #ff3b30;
    --purple: #af52de;
    --pink: #ff2d92;
    --yellow: #ffcc00;
    --teal: #5ac8fa;
  }
  [data-theme="dark"] {
    --bg-window: #1a1a1c;
    --bg-sidebar: rgba(40,40,42,0.8);
    --bg-main: #2c2c2e;
    --bg-card: #3a3a3c;
    --bg-hover: rgba(255,255,255,0.08);
    --bg-active: rgba(255,255,255,0.12);
    --text-primary: #f5f5f7;
    --text-secondary: #aeaeb2;
    --text-tertiary: #6e6e73;
    --border-color: rgba(255,255,255,0.1);
    --shadow-window: 0 20px 60px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #c7d6e5 0%, #a8b8c8 100%);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    color: var(--text-primary);
  }
  [data-theme="dark"] body { background: linear-gradient(135deg, #2a2a2c 0%, #1a1a1c 100%); }

  .window {
    max-width: 1280px; margin: 24px auto;
    background: var(--bg-window);
    border-radius: 12px;
    box-shadow: var(--shadow-window);
    overflow: hidden;
    display: flex; flex-direction: column;
    height: calc(100vh - 48px);
    border: 1px solid var(--border-color);
  }
  .titlebar {
    height: 38px; display: flex; align-items: center;
    padding: 0 14px; gap: 8px;
    background: var(--bg-sidebar);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
  }
  .traffic-lights { display: flex; gap: 8px; }
  .traffic-light { width: 12px; height: 12px; border-radius: 50%; }
  .tl-red { background: #ff5f57; } .tl-yellow { background: #febc2e; } .tl-green { background: #28c840; }
  .titlebar-title {
    flex: 1; text-align: center; font-size: 13px; font-weight: 600;
    color: var(--text-secondary); pointer-events: none;
  }
  .titlebar-actions { display: flex; gap: 8px; }
  .titlebar-actions button {
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 6px;
  }
  .titlebar-actions button:hover { background: var(--bg-hover); }

  .body { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 200px; flex-shrink: 0;
    background: var(--bg-sidebar);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 10px 10px;
    overflow-y: auto;
    border-right: 1px solid var(--border-color);
  }
  .sidebar-group { margin-bottom: 4px; }
  .sidebar-label {
    font-size: 11px; font-weight: 700; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: 0.5px;
    padding: 12px 10px 4px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--text-primary);
    transition: background 0.15s; margin-bottom: 1px;
  }
  .nav-item:hover { background: var(--bg-hover); }
  .nav-item.active { background: var(--accent); color: #fff; }
  .nav-item.active .nav-icon { color: #fff; }
  .nav-icon { width: 20px; text-align: center; font-size: 14px; }
  .nav-sub { padding-left: 36px; font-size: 12px; font-weight: 400; }

  .main { flex: 1; overflow-y: auto; background: var(--bg-main); padding: 24px 28px; }
  .page-title { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
  .page-subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 24px; }

  .card {
    background: var(--bg-card); border-radius: 12px; padding: 20px;
    border: 1px solid var(--border-color); transition: box-shadow 0.2s;
  }
  .stat-card { display: flex; align-items: center; gap: 14px; }
  .stat-icon {
    width: 44px; height: 44px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff; flex-shrink: 0;
  }
  .stat-value { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .stat-label { font-size: 12px; color: var(--text-secondary); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
    border: none; cursor: pointer; transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--bg-hover); color: var(--text-primary); }
  .btn-secondary:hover { background: var(--bg-active); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .input, .select, .textarea {
    width: 100%; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border-color); background: var(--bg-card);
    color: var(--text-primary); font-size: 13px; font-family: inherit;
    outline: none; transition: border 0.15s;
  }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
  .label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; display: block; }
  .form-group { margin-bottom: 14px; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-high { background: rgba(255,59,48,0.15); color: var(--red); }
  .badge-mid { background: rgba(255,149,0,0.15); color: var(--orange); }
  .badge-low { background: rgba(52,199,89,0.15); color: var(--green); }

  .list-item {
    display: flex !important; align-items: center; gap: 12px;
    padding: 12px 16px; border-radius: 10px;
    background: var(--bg-card); border: 1px solid var(--border-color);
    margin-bottom: 8px; transition: background 0.15s;
  }
  .list-item:hover { background: var(--bg-hover); }
  /* 待办列表：紧凑单行样式，一行一行看清楚、一屏更多条 */
  .todo-row { padding: 3px 8px; margin-bottom: 0; border-bottom: 1px solid var(--border-color); background: transparent; align-items: flex-start; line-height: 1.25; min-height: 0; }
  .todo-row:last-child { border-bottom: none; }
  .todo-row:hover { background: var(--bg-hover); }
  .todo-row .todo-title { font-size: 13px; line-height: 1.25; }
  .todo-row .todo-meta { font-size: 10px; line-height: 1.25; color: var(--text-secondary); margin-top: 1px; }
  .todo-row .todo-meta .badge, .todo-row .todo-meta .tag { padding: 1px 4px; font-size: 10px; border-radius: 4px; }
  .todo-row .checkbox { width: 14px; height: 14px; margin-top: 2px; border-width: 1.5px; border-radius: 3px; }
  .todo-row .checkbox.checked::after { font-size: 9px; }
  .todo-row .item-actions { gap: 2px; align-self: center; }
  .todo-row .item-actions .icon-btn { padding: 2px; font-size: 10px; line-height: 1; }
  .item-actions { margin-left: auto; display: flex; gap: 6px; }
  .icon-btn.recording, .btn.recording { color: var(--red); box-shadow: 0 0 0 3px rgba(255,59,48,0.25); animation: recpulse 1.1s infinite; }
  @keyframes recpulse { 0%,100%{opacity:1;} 50%{opacity:.45;} }
  .icon-btn {
    background: none; border: none; cursor: pointer; padding: 6px;
    border-radius: 6px; color: var(--text-secondary); font-size: 13px;
  }
  .icon-btn:hover { background: var(--bg-active); color: var(--text-primary); }
  .icon-btn.danger:hover { color: var(--red); }

  .statusbar {
    height: 28px; display: flex; align-items: center;
    padding: 0 16px; font-size: 11px; color: var(--text-secondary);
    background: var(--bg-sidebar); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-color); flex-shrink: 0;
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; z-index: 1000;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-card); border-radius: 14px; padding: 24px;
    width: 460px; max-width: 90vw; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .modal-title { font-size: 17px; font-weight: 700; margin: 0 0 18px; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--text-primary); color: var(--bg-main);
    padding: 10px 22px; border-radius: 20px; font-size: 13px; font-weight: 500;
    opacity: 0; transition: all 0.3s; z-index: 2000; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.has-action { pointer-events: auto; }
  .toast-undo { margin-left: 14px; background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 14px; padding: 3px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .toast-undo:active { opacity: .7; }

  .page { display: none; animation: fadeIn 0.25s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .book-card {
    background: var(--bg-card); border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  }
  .book-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
  .book-cover { height: 140px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 600; text-align: center; padding: 12px; }
  .book-info { padding: 10px 12px; }
  .book-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-author { font-size: 11px; color: var(--text-secondary); }

  .progress-bar { height: 4px; background: var(--bg-hover); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }

  .checkbox { width: 18px; height: 18px; border: 2px solid var(--text-tertiary); border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .checkbox.checked::after { content: "✓"; color: #fff; font-size: 11px; font-weight: 700; }

  .todo-done .todo-title { text-decoration: line-through; color: var(--text-tertiary); }

  .mood-emoji { font-size: 28px; cursor: pointer; padding: 6px; border-radius: 8px; transition: background 0.15s; }
  .mood-emoji:hover { background: var(--bg-hover); }
  .mood-emoji.selected { background: var(--bg-active); }

  .heatmap-cell { width: 13px; height: 13px; border-radius: 3px; background: var(--bg-hover); }
  .heatmap-cell.m5 { background: #34c759; } .heatmap-cell.m4 { background: #8ed18a; }
  .heatmap-cell.m3 { background: #ffcc00; } .heatmap-cell.m2 { background: #ff9500; }
  .heatmap-cell.m1 { background: #ff3b30; }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: rgba(0,122,255,0.1); color: var(--accent); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-tertiary); }
  .empty-state i { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  [data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 768px) {
    .grid-2 { grid-template-columns: 1fr; }
    .sidebar { width: 160px; }
    .window { margin: 0; border-radius: 0; height: 100vh; }
  }
</style>
</head>
<body>
<div class="window">
  <!-- 标题栏 -->
  <div class="titlebar">
    <div class="traffic-lights">
      <div class="traffic-light tl-red"></div>
      <div class="traffic-light tl-yellow"></div>
      <div class="traffic-light tl-green"></div>
    </div>
    <div class="titlebar-title" id="titlebarTitle">个人工作台</div>
    <div class="titlebar-actions">
      <button onclick="toggleTheme()" title="切换主题"><i class="fas fa-moon" id="themeIcon"></i></button>
      <button onclick="openSettings()" title="设置"><i class="fas fa-cog"></i></button>
    </div>
  </div>

  <!-- 主体 -->
  <div class="body">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="sidebar-group">
        <div class="nav-item active" data-page="todos" onclick="navigate('todos')">
          <i class="fas fa-check-square nav-icon"></i> 待办
        </div>
      </div>
      <div class="sidebar-group">
        <div class="sidebar-label">运动</div>
        <div class="nav-item" data-page="dance" onclick="navigate('dance')">
          <i class="fas fa-music nav-icon"></i> 舞蹈
        </div>
        <div class="nav-item" data-page="body" onclick="navigate('body')">
          <i class="fas fa-weight nav-icon"></i> 身材
        </div>
      </div>
      <div class="sidebar-group">
        <div class="sidebar-label">生活</div>
        <div class="nav-item" data-page="books" onclick="navigate('books')">
          <i class="fas fa-book nav-icon"></i> 读书
        </div>
        <div class="nav-item" data-page="finance" onclick="navigate('finance')">
          <i class="fas fa-wallet nav-icon"></i> 财务
        </div>
        <div class="nav-item" data-page="diary" onclick="navigate('diary')">
          <i class="fas fa-pen-fancy nav-icon"></i> 日记
        </div>
        <div class="nav-item" data-page="study" onclick="navigate('study')">
          <i class="fas fa-graduation-cap nav-icon"></i> 英语
        </div>
        <div class="nav-item" data-page="outfit" onclick="navigate('outfit')">
          <i class="fas fa-tshirt nav-icon"></i> 穿搭
        </div>
        <div class="nav-item" data-page="family" onclick="navigate('family')">
          <i class="fas fa-baby nav-icon"></i> 亲子
        </div>
      </div>
      <div class="sidebar-group">
        <div class="sidebar-label">宝藏</div>
        <div class="nav-item" data-page="treasure" onclick="navigate('treasure')">
          <i class="fas fa-gem nav-icon"></i> 宝藏访谈
        </div>
      </div>
      <div class="sidebar-group">
        <div class="sidebar-label">健康</div>
        <div class="nav-item" data-page="rgp" onclick="navigate('rgp')">
          <i class="fas fa-eye nav-icon"></i> RGP护理
        </div>
      </div>
    </div>

    <!-- 主内容区 -->
    <div class="main" id="mainContent">
      <!-- 各页面动态渲染 -->
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="statusbar" id="statusbar">
    <span id="statusText">就绪</span>
  </div>
</div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===================== 数据层 =====================
const DB = {
  get(key, def=null) {
    try { const v = localStorage.getItem('workbench_'+key); return v ? JSON.parse(v) : def; }
    catch(e) { return def; }
  },
  set(key, val) { localStorage.setItem('workbench_'+key, JSON.stringify(val)); },
  remove(key) { localStorage.removeItem('workbench_'+key); },
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
};

const SETTINGS = DB.get('settings', { height: 170, name: '我', theme: 'light' });

// ===================== 工具函数 =====================
function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) {
  if(!d) return '';
  const dt = new Date(d);
  return `${dt.getMonth()+1}月${dt.getDate()}日`;
}
function fmtDateTime(d) {
  if(!d) return '';
  const dt = new Date(d);
  return `${dt.getMonth()+1}月${dt.getDate()}日 ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}
function toast(msg, duration = 2200, action) {
  const t = document.getElementById('toast');
  if(action && action.label) {
    t.innerHTML = `<span>${msg}</span><button type="button" class="toast-undo">${action.label}</button>`;
    t.classList.add('has-action');
    t.querySelector('.toast-undo').onclick = () => {
      clearTimeout(t._timer); t.classList.remove('show'); t.classList.remove('has-action');
      if(action.onClick) action.onClick();
    };
  } else {
    t.textContent = msg; t.classList.remove('has-action');
  }
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.classList.remove('show'); t.classList.remove('has-action'); }, duration);
}
function showModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target.id==='modalOverlay') closeModal(); });

function toggleTheme() {
  SETTINGS.theme = SETTINGS.theme === 'light' ? 'dark' : 'light';
  applyTheme(); DB.set('settings', SETTINGS);
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', SETTINGS.theme);
  document.getElementById('themeIcon').className = SETTINGS.theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}
applyTheme();

// ===================== 导航 =====================
const PAGE_TITLES = {
  dashboard: '概览', dance: '舞蹈记录', body: '身材记录',
  books: '读书', todos: '任务待办', finance: '财务记账', diary: '心情日记', study: '英语学习', outfit: '穿搭灵感', family: '亲子时光', treasure: '宝藏访谈', rgp: 'RGP护理用品'
};
function navigate(page) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const nav = document.querySelector(`.nav-item[data-page="${page}"]`);
  if(nav) nav.classList.add('active');
  document.getElementById('titlebarTitle').textContent = PAGE_TITLES[page] || '个人工作台';
  renderPage(page);
  updateStatusbar();
}

function renderPage(page) {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  switch(page) {
    case 'dashboard': renderDashboard(main); break;
    case 'dance': renderDance(main); break;
    case 'body': renderBody(main); break;
    case 'books': renderBooks(main); break;
    case 'todos': renderTodos(main); break;
    case 'finance': renderFinance(main); break;
    case 'diary': renderDiary(main); break;
    case 'study': renderStudy(main); break;
    case 'outfit': renderOutfit(main); break;
    case 'family': renderFamily(main); break;
    case 'treasure': renderTreasure(main); break;
    case 'rgp': renderRGP(main); break;
  }
}

function updateStatusbar() {
  const todos = DB.get('todos', []);
  const todayTodos = todos.filter(t => t.dueDate === today());
  const done = todayTodos.filter(t => t.done).length;
  const dance = DB.get('dance_records', []);
  const weekDance = dance.filter(d => isThisWeek(d.date)).length;
  const parts = [];
  if(todayTodos.length) parts.push(`今日任务 ${done}/${todayTodos.length}`);
  parts.push(`本周舞蹈 ${weekDance} 次`);
  const books = DB.get('books', []);
  const reading = books.filter(b => b.status === 'reading').length;
  if(reading) parts.push(`在读 ${reading} 本`);
  const studyChecks = (DB.get('study_checks',{})[today()]||{});
  const studyDone = STUDY_TASKS.filter(t => studyChecks[t.id]).length;
  parts.push(`英语打卡 ${studyDone}/${STUDY_TASKS.length}`);
  document.getElementById('statusText').textContent = parts.join(' · ') || '就绪';
}

function isThisWeek(dateStr) {
  const d = new Date(dateStr); const now = new Date();
  const day = (now.getDay()+6)%7;
  const monday = new Date(now); monday.setDate(now.getDate()-day); monday.setHours(0,0,0,0);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+7);
  return d >= monday && d < sunday;
}
function isThisMonth(dateStr) {
  const d = new Date(dateStr); const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

// ===================== 概览页 =====================
function renderDashboard(main) {
  const todos = DB.get('todos', []);
  const dance = DB.get('dance_records', []);
  const body = DB.get('body_records', []);
  const books = DB.get('books', []);
  const finance = DB.get('finance', []);
  const diaries = DB.get('diaries', []);

  const todayTodos = todos.filter(t => t.dueDate === today());
  const todayDone = todayTodos.filter(t => t.done).length;
  const weekDance = dance.filter(d => isThisWeek(d.date));
  const todayExpense = finance.filter(f => f.date === today() && f.type === 'expense').reduce((s,f)=>s+f.amount,0);
  const readingBooks = books.filter(b => b.status === 'reading');
  const monthExpense = finance.filter(f => isThisMonth(f.date) && f.type==='expense').reduce((s,f)=>s+f.amount,0);
  const monthIncome = finance.filter(f => isThisMonth(f.date) && f.type==='income').reduce((s,f)=>s+f.amount,0);

  let html = `<h1 class="page-title">你好，${SETTINGS.name} 👋</h1>
    <p class="page-subtitle">${new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</p>

        <div class="stat-icon" style="background:var(--accent)"><i class="fas fa-check"></i></div>

      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--pink)"><i class="fas fa-music"></i></div>
        <div><div class="stat-value">${weekDance.length}</div><div class="stat-label">本周舞蹈(次)</div></div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--red)"><i class="fas fa-yen-sign"></i></div>
        <div><div class="stat-value">¥${todayExpense.toFixed(0)}</div><div class="stat-label">今日支出</div></div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--green)"><i class="fas fa-book-open"></i></div>
        <div><div class="stat-value">${readingBooks.length}</div><div class="stat-label">在读本书</div></div>
      </div>
    </div>`;

  // 概览：待办清单置于运动趋势上方（纯横线分隔，无外边框）
  const openTodos = todos.filter(t => !t.done).sort((a,b)=>{
    const p = {high:0,mid:1,low:2};
    const at = (a.dueDate===today())?0:1, bt = (b.dueDate===today())?0:1;
    if(at !== bt) return at - bt;
    if(p[a.priority] !== p[b.priority]) return p[a.priority]-p[b.priority];
    return (a.dueDate||'').localeCompare(b.dueDate||'');
  });
  html += `
    <div style="margin-top:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;">
        <h3 style="margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;">📋 待办 (${openTodos.length})</h3>
        <button class="btn btn-secondary btn-sm" style="white-space:nowrap;flex-shrink:0;" onclick="voiceAddTodo(this)"><i class="fas fa-microphone"></i> 语音加</button>
      </div>
      <div id="dashTodos">${openTodos.length ? todoListHTML(openTodos) : '<div class="empty-state" style="padding:14px;"><div style="font-size:13px;">暂无待办，点「语音加」或左侧待办添加</div></div>'}</div>
    </div>`;

  html += `<div class="grid-2">
      <div class="card">
        <h3 style="margin:0 0 16px;font-size:15px;">本周运动趋势</h3>
        <canvas id="dashDanceChart" height="160"></canvas>
      </div>
      <div class="card">
        <h3 style="margin:0 0 16px;font-size:15px;">本月收支</h3>
        <div style="display:flex;gap:20px;margin-bottom:16px;">
          <div><div style="font-size:11px;color:var(--text-secondary)">收入</div><div style="font-size:20px;font-weight:700;color:var(--green)">¥${monthIncome.toFixed(0)}</div></div>
          <div><div style="font-size:11px;color:var(--text-secondary)">支出</div><div style="font-size:20px;font-weight:700;color:var(--red)">¥${monthExpense.toFixed(0)}</div></div>
          <div><div style="font-size:11px;color:var(--text-secondary)">结余</div><div style="font-size:20px;font-weight:700">¥${(monthIncome-monthExpense).toFixed(0)}</div></div>
        </div>
        <canvas id="dashFinanceChart" height="100"></canvas>
      </div>
    </div>`;

  // 最近日记
  const lastDiary = diaries.sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(lastDiary) {
    html += `<div class="card" style="margin-top:16px;">
      <h3 style="margin:0 0 8px;font-size:15px;">最近日记 · ${fmtDate(lastDiary.date)}</h3>
      <div style="font-size:24px;margin-bottom:6px;">${['😢','😞','😐','😄','😊'][lastDiary.mood-1]}</div>
      <div style="font-size:13px;color:var(--text-secondary);">${(lastDiary.content||'').slice(0,120)}${lastDiary.content&&lastDiary.content.length>120?'...':''}</div>
    </div>`;
  }

  main.innerHTML = html;

  // 本周舞蹈图表
  const days = ['一','二','三','四','五','六','日'];
  const weekData = days.map((_,i) => {
    const d = new Date(); const day = (d.getDay()+6)%7;
    const monday = new Date(d); monday.setDate(d.getDate()-day+i);
    const ds = monday.toISOString().slice(0,10);
    return dance.filter(x => x.date === ds).reduce((s,x)=>s+x.duration,0);
  });
  new Chart(document.getElementById('dashDanceChart'), {
    type: 'bar',
    data: { labels: days, datasets: [{ label:'舞蹈时长(分钟)', data: weekData, backgroundColor: 'rgba(255,45,146,0.6)', borderRadius: 6 }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });

  // 本月支出分类
  const cats = ['餐饮','交通','购物','娱乐','其他'];
  const catData = cats.map(c => finance.filter(f=>isThisMonth(f.date)&&f.type==='expense'&&f.category===c).reduce((s,f)=>s+f.amount,0));
  new Chart(document.getElementById('dashFinanceChart'), {
    type: 'doughnut',
    data: { labels: cats, datasets: [{ data: catData, backgroundColor: ['#ff3b30','#007aff','#af52de','#ff9500','#8e8e93'] }] },
    options: { responsive: true, plugins: { legend: { position: 'right', labels: { font: { size: 11 } } } } }
  });
}

// ===================== 舞蹈模块 =====================
function renderDance(main) {
  const records = DB.get('dance_records', []).sort((a,b)=>b.date.localeCompare(a.date));
  const weekRecords = records.filter(r => isThisWeek(r.date));
  const monthRecords = records.filter(r => isThisMonth(r.date));
  const weekMin = weekRecords.reduce((s,r)=>s+r.duration,0);
  const monthMin = monthRecords.reduce((s,r)=>s+r.duration,0);

  main.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;">
      <div><h1 class="page-title">舞蹈记录</h1><p class="page-subtitle">记录每一次起舞 💃</p></div>
      <button class="btn btn-primary" onclick="danceForm()"><i class="fas fa-plus"></i> 记录</button>
    </div>
    <div class="grid-stats">
      <div class="card stat-card"><div class="stat-icon" style="background:var(--pink)"><i class="fas fa-music"></i></div><div><div class="stat-value">${weekRecords.length}</div><div class="stat-label">本周次数</div></div></div>
      <div class="card stat-card"><div class="stat-icon" style="background:var(--purple)"><i class="fas fa-clock"></i></div><div><div class="stat-value">${weekMin}</div><div class="stat-label">本周时长(分)</div></div></div>
      <div class="card stat-card"><div class="stat-icon" style="background:var(--teal)"><i class="fas fa-calendar"></i></div><div><div class="stat-value">${monthRecords.length}</div><div class="stat-label">本月次数</div></div></div>
      <div class="card stat-card"><div class="stat-icon" style="background:var(--orange)"><i class="fas fa-hourglass"></i></div><div><div class="stat-value">${monthMin}</div><div class="stat-label">本月时长(分)</div></div></div>
    </div>
    <div class="card" style="margin-bottom:20px;"><h3 style="margin:0 0 12px;font-size:15px;">近30天趋势</h3><canvas id="danceTrendChart" height="80"></canvas></div>
    <h3 style="font-size:15px;margin:0 0 12px;">记录列表</h3>
    <div id="danceList">${danceListHTML(records)}</div>`;

  // 趋势图：最近30天每天时长
  const trend = [];
  const labels = [];
  for(let i=29;i>=0;i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    labels.push(`${d.getMonth()+1}/${d.getDate()}`);
    trend.push(records.filter(r=>r.date===ds).reduce((s,r)=>s+r.duration,0));
  }
  new Chart(document.getElementById('danceTrendChart'), {
    type: 'line',
    data: { labels, datasets: [{ label:'时长(分钟)', data: trend, borderColor: 'var(--pink)', backgroundColor: 'rgba(255,45,146,0.1)', fill: true, tension: 0.3 }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}
function danceListHTML(records) {
  if(!records.length) return `<div class="empty-state"><i class="fas fa-music"></i><div>还没有舞蹈记录，点击「记录」开始</div></div>`;
  const typeColors = {'街舞':'#ff2d92','爵士':'#af52de','古典':'#ff9500','民族':'#34c759','其他':'#8e8e93'};
  const intensityText = {1:'轻松',2:'中等',3:'高强度'};

        <button class="icon-btn" onclick="danceForm('${r.id}')"><i class="fas fa-edit"></i></button>

function saveDance(id) {
  const rec = {
    date: document.getElementById('df_date').value,
    type: document.getElementById('df_type').value,
    duration: parseInt(document.getElementById('df_duration').value)||0,
    intensity: parseInt(document.getElementById('df_intensity').value),
    note: document.getElementById('df_note').value.trim()
  };
  const list = DB.get('dance_records',[]);
  if(id) { const i=list.findIndex(x=>x.id===id); if(i>=0){ list[i]={...list[i],...rec}; } }
  else { rec.id = DB.uid(); list.push(rec); }
  DB.set('dance_records', list);
  closeModal(); renderDance(document.getElementById('mainContent')); updateStatusbar();
  toast('舞蹈记录已保存');
}
function delDance(id) {
  if(!confirm('确定删除这条记录？')) return;
  DB.set('dance_records', DB.get('dance_records',[]).filter(x=>x.id!==id));
  renderDance(document.getElementById('mainContent')); updateStatusbar(); toast('已删除');
}

function addTodoImages(input) {
  const files = input.files;
  if(!files || !files.length) return;
  let pending = files.length;
  for(const f of files) {
    fileToDataURL(f, (url)=>{
      if(url) _todoImages.push(url);
      const box = document.getElementById('td_images');
      if(box) box.innerHTML = imgPreviewHTML();
      if(--pending === 0) input.value = '';
    });
  }
}
function removeTodoImage(i) {

  const box = document.getElementById('td_images');
  if(box) box.innerHTML = imgPreviewHTML();

// 读取图片文件，压缩到最长边 900px 的 JPEG，降低体积以便存入 localStorage
function fileToDataURL(file, cb) {
  if(!file || !file.type || file.type.indexOf('image') !== 0) { cb(''); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height; const max = 900;
      if(w > h && w > max) { h = Math.round(h * max / w); w = max; }
      else if(h > max) { w = Math.round(w * max / h); h = max; }
      try {
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(c.toDataURL('image/jpeg', 0.7));
      } catch(e) { cb(reader.result); }
    };
    img.onerror = () => cb(reader.result);
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function delTodo(id, force) {

  const list = DB.get('todos', []);
  const i = list.findIndex(x => x.id === id);
  if(i < 0) return;
  const removed = list[i];
  list.splice(i, 1);
  DB.set('todos', list);
  trashTodo(removed);
  refreshTodoView();
  toast(`已删除「${removed.title}」`, 5000, {
    label: '撤销',
    onClick: () => {
      const l = DB.get('todos', []); l.push(removed); DB.set('todos', l);
      DB.set('todo_trash', DB.get('todo_trash', []).filter(x => x.todo.id !== removed.id));
      refreshTodoView(); toast('已恢复');
    }
  });
}
// 将删除的待办移入“最近删除”，保留 30 天（最多 50 条）
function trashTodo(t) {
  const list = DB.get('todo_trash', []);
  list.unshift({ todo: t, deletedAt: Date.now() });
  const cutoff = Date.now() - 30 * 86400000;
  DB.set('todo_trash', list.filter(x => x.deletedAt >= cutoff).slice(0, 50));
}
// 打开“最近删除”列表，可恢复或彻底删除
function openTrash() {
  const list = DB.get('todo_trash', []);
  if(!list.length) { toast('最近删除为空'); return; }
  const items = list.map(x => {
    const t = x.todo;
    const imgs = (t.images && t.images.length) ? ` · 📷${t.images.length}` : '';
    return `<div class="list-item" style="align-items:center;">
      <div style="flex:1;min-width:0;">
        <div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.title}</div>
        <div class="todo-meta">${fmtDateTime(x.deletedAt)} 删除${imgs}</div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="restoreFromTrash('${t.id}')" style="margin-left:8px;flex-shrink:0;">恢复</button>
      <button class="icon-btn danger" onclick="purgeTrash('${t.id}')" style="margin-left:4px;flex-shrink:0;"><i class="fas fa-trash"></i></button>
    </div>`;
  }).join('');
  showModal(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 class="modal-title" style="margin:0;">最近删除</h3><button class="btn btn-secondary btn-sm" onclick="closeModal()">关闭</button></div><div>${items}</div><div style="font-size:11px;color:var(--text-tertiary);margin-top:8px;">保留 30 天，可恢复或彻底删除</div>`);
}
function restoreFromTrash(id) {
  const trash = DB.get('todo_trash', []);
  const item = trash.find(x => x.todo.id === id);
  if(!item) return;
  const l = DB.get('todos', []); l.push(item.todo); DB.set('todos', l);
  DB.set('todo_trash', trash.filter(x => x.todo.id !== id));
  closeModal(); refreshTodoView(); toast('已恢复');
}
function purgeTrash(id) {
  DB.set('todo_trash', DB.get('todo_trash', []).filter(x => x.todo.id !== id));
  openTrash();
}

function fmtDateTime(dt) {
  if(!dt) return '';
  const d = new Date(dt);
  if(isNaN(d.getTime())) return dt;
  const p = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 请求系统通知权限（需用户手势触发）
function requestNotify() {
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default') {
    try { Notification.requestPermission().catch(()=>{}); } catch(e) {}
  }
}

// 检查已到提醒时间且未完成的待办，弹出系统通知/页面提示
function checkReminders() {
  try {
    const todos = DB.get('todos', []);
    const now = Date.now();
    const notified = DB.get('todo_notified', []);
    const fired = [];
    todos.forEach(t => {
      if(t.done || !t.reminder) return;
      const time = new Date(t.reminder).getTime();
      if(isNaN(time) || time > now) return;
      if(notified.includes(t.id)) return;
      fired.push(t);
    });
    if(!fired.length) return;
    if('Notification' in window && Notification.permission === 'granted') {
      fired.forEach(t => {
        try { new Notification('⏰ 任务提醒', { body: t.title + (t.dueDate ? ('（截止 '+fmtDate(t.dueDate)+'）') : '') }); } catch(e) {}
      });
    }
    if(fired.length === 1) toast('⏰ '+fired[0].title, 4500);
    else toast('⏰ 有 '+fired.length+' 个任务到提醒时间', 4500);
    DB.set('todo_notified', notified.concat(fired.map(t=>t.id)));
    const active = document.querySelector('.nav-item.active');
    if(active && active.getAttribute('data-page') === 'todos') {
      setTimeout(() => renderTodos(document.getElementById('mainContent')), 50);
    }
  } catch(e) { console.error('checkReminders error', e); }
}

// ===================== 语音识别模块 =====================
let _sr = null; // 当前 SpeechRecognition 实例
function speechSupported() {
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
// 切换录音：btn=麦克风按钮(加高亮)，handlers={onInterim(text), onStop(finalText)}，
// continuous=false 时说完即自动结束（用于语音加任务）
function toggleSpeech(btn, handlers, continuous) {
  if(_sr) { try { _sr.stop(); } catch(e){} _sr = null; return; }
  if(!speechSupported()) { toast('当前浏览器不支持语音输入（可尝试 Chrome/Edge 手机版）'); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new SR();
  r.lang = 'zh-CN'; r.interimResults = true; r.continuous = (continuous === false) ? false : true;
  let finalText = '';
  r.onresult = (e) => {
    let inter = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText += t; else inter += t;
    }
    if(handlers && handlers.onInterim) handlers.onInterim(finalText + inter);
  };
  r.onerror = (ev) => { toast('语音识别出错：'+(ev.error||'error')); _sr=null; if(btn) btn.classList.remove('recording'); };
  r.onend = () => {
    _sr = null; if(btn) btn.classList.remove('recording');
    if(handlers && handlers.onStop) handlers.onStop(finalText);
  };
  try { r.start(); _sr = r; if(btn) btn.classList.add('recording'); }
  catch(err) { toast('无法启动录音：'+err.message); }
}

// 长按手势：触摸/鼠标按住约 550ms 触发 onLong，短按不触发
function bindLongPress(el, onLong, ms) {
  if(!el) return;
  ms = ms || 550;
  let timer = null;
  const start = () => {
    el._longOk = false;
    if(timer) clearTimeout(timer);
    timer = setTimeout(() => { timer = null; el._longOk = true; onLong(el); }, ms);
  };
  const clear = () => { if(timer){ clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchend', clear);
  el.addEventListener('touchmove', clear, {passive:true});
  el.addEventListener('touchcancel', clear);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', clear);
  el.addEventListener('mouseleave', clear);
}

// 右滑删除：在容器上委托监听触屏滑动，向右滑过阈值即删除待办项（不弹确认）；
// 向左滑动不可删除（仅复位）；普通点按仍会打开编辑
function enableSwipeDelete(container) {
  if(!container || container._swipeBound) return;
  container._swipeBound = true;
  let row = null, swiping = false, startX = 0, startY = 0, dx = 0;
  const THRESH = 55;
  const onStart = (e) => {
    const r = e.target.closest('.todo-row');
    if(!r) return;
    row = r; swiping = true; dx = 0; startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  };
  const onMove = (e) => {
    if(!swiping || !row) return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    dx = x - startX; const dy = y - startY;
    if(dx > 8 && dx > Math.abs(dy)) {           // 仅向右的水平滑动可删除
      e.preventDefault();
      row.style.transition = 'none';
      row.style.transform = 'translateX(' + dx + 'px)';
      row.style.background = 'rgba(255,59,48,0.12)';
    } else if(dx < 0) {                          // 向左滑动：不删除，复位
      row.style.transform = '';
      row.style.background = '';
    }
  };
  const onEnd = () => {
    if(!swiping || !row) return;
    swiping = false;
    const r = row; row = null;
    r.style.transition = 'transform .18s ease';
    if(dx >= THRESH) {
      r.style.transform = 'translateX(100%)';
      r._swiped = true;
      setTimeout(() => { const id = r.getAttribute('data-id'); if(id) delTodo(id, true); }, 150);
    } else {
      r.style.transform = ''; r.style.background = '';
    }
  };
  container.addEventListener('touchstart', onStart, {passive:true});
  container.addEventListener('touchmove', onMove, {passive:false});
  container.addEventListener('touchend', onEnd);
  container.addEventListener('touchcancel', onEnd);
  // 滑动删除后吞掉随之而来的 click，避免误开编辑
  container.addEventListener('click', (e) => {
    const r = e.target.closest('.todo-row');
    if(r && r._swiped) { e.stopPropagation(); e.preventDefault(); r._swiped = false; }
  }, true);
}

// 解析中文自然语言中的日期与时间，用于语音加任务自动填日期/闹钟
// 返回 { date:'YYYY-MM-DD'|null, time:'HH:MM'|null }
function parseZhDateTime(raw) {
  const text = (raw||'').replace(/\s+/g,'');
  const fmt = (d) => { const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
  const addDays = (n) => { const d=new Date(); d.setDate(d.getDate()+n); return d; };
  let dateStr = null, timeStr = null;

  // —— 日期 ——
  if(/(今天|今日)/.test(text)) dateStr = fmt(new Date());
  else if(/(明天|明日)/.test(text)) dateStr = fmt(addDays(1));
  else if(/后天/.test(text)) dateStr = fmt(addDays(2));
  else if(/大后天/.test(text)) dateStr = fmt(addDays(3));
  else if(/(昨天|昨日)/.test(text)) dateStr = fmt(addDays(-1));
  else {
    const wmap = {'日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
    const wm = text.match(/(?:周|星期|礼拜)\s*([日天一二三四五六])/);
    if(wm) {
      const target = wmap[wm[1]];
      const cur = new Date().getDay();
      let diff = (target - cur + 7) % 7; if(diff === 0) diff = 7;
      dateStr = fmt(addDays(diff));
    } else {
      const md = text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日?/);
      if(md) { const m=+md[1], d=+md[2]; const yy=new Date().getFullYear(); let dt=new Date(yy,m-1,d); if(dt<new Date()) dt=new Date(yy+1,m-1,d); dateStr=fmt(dt); }
      else {
        const sl = text.match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
        if(sl) { const m=+sl[1], d=+sl[2]; const yy=new Date().getFullYear(); let dt=new Date(yy,m-1,d); if(dt<new Date()) dt=new Date(yy+1,m-1,d); dateStr=fmt(dt); }
        else {
          const hao = text.match(/(\d{1,2})\s*号/);
          if(hao) { const d=+hao[1]; const dt=new Date(); dt.setDate(d); if(dt<new Date()) dt.setMonth(dt.getMonth()+1); dateStr=fmt(dt); }
        }
      }
    }
  }

  // —— 时间 ——
  const apm = text.match(/(上午|早上|早晨|凌晨|中午|下午|傍晚|晚上|夜里|半夜)/);
  const colon = text.match(/(\d{1,2})[:：](\d{1,2})/);
  const tm = text.match(/(\d{1,2})\s*(点|时)(?:\s*(\d{1,2})\s*分?)?/);
  let hour = null, minute = 0;
  if(colon) { hour = +colon[1]; minute = +colon[2]; }
  else if(tm) { hour = +tm[1]; if(tm[3] !== undefined) minute = +tm[3]; if(/半/.test(text) && minute === 0) minute = 30; }
  if(hour !== null) {
    const ap = apm ? apm[1] : '';
    if(/(下午|傍晚|晚上|夜里|半夜)/.test(ap) && hour < 12) hour += 12;
    const p = n => String(n).padStart(2,'0');
    timeStr = p(hour) + ':' + p(minute);
  }

  return { date: dateStr, time: timeStr };
}

// 从语音原文中剔除已识别的日期/时间词与常用语气词，得到干净标题
function cleanTitle(raw, parsed) {
  let s = raw || '';
  s = s.replace(/(\d{1,2})\s*(点|时)(?:\s*\d{1,2}\s*分?)?/g, '')
       .replace(/(上午|早上|早晨|凌晨|中午|下午|傍晚|晚上|夜里|半夜)/g, '')
       .replace(/半/g, '').replace(/分/g, '')
       .replace(/(\d{1,2})[:：]\d{1,2}/g, '')
       .replace(/(今天|今日|明天|明日|后天|大后天|昨天|昨日)/g, '')
       .replace(/(?:周|星期|礼拜)\s*[日天一二三四五六]/g, '')
       .replace(/(\d{1,2})\s*月\s*\d{1,2}\s*日?/g, '')
       .replace(/(\d{1,2})\s*\/\s*\d{1,2}/g, '')
       .replace(/(\d{1,2})\s*号/g, '')
       .replace(/(提醒我|帮我|记得|闹钟|定个?闹钟|设置?闹钟|我要|我想|预约)/g, '')
       .replace(/\s+/g, ' ').trim();
  return s || (raw || '');
}

// 概览/待办页：语音直接添加一条待办（说完即自动结束录入；自动识别日期/时间/闹钟）
function voiceAddTodo(btn) {
  toggleSpeech(btn, {
    onInterim: (txt) => {
      let hint = document.getElementById('voiceHint');
      if(!hint) {
        hint = document.createElement('div');
        hint.id = 'voiceHint';
        hint.style.cssText = 'padding:8px 10px;margin-bottom:10px;border-radius:8px;background:var(--bg-hover);font-size:13px;color:var(--text-primary);';
        const box = document.getElementById('dashTodos') || document.getElementById('todoList');
        if(box) box.parentNode.insertBefore(hint, box);
      }
      hint.textContent = '🎤 ' + (txt || '聆听中…');
    },
    onStop: (finalText) => {
      const txt = (finalText||'').trim();
      const h = document.getElementById('voiceHint'); if(h) h.remove();
      if(!txt) return;
      const p = parseZhDateTime(txt);
      const title = cleanTitle(txt, p);
      const dueDate = p.date || today();
      let reminder = '';
      if(p.time) { reminder = (p.date || today()) + 'T' + p.time; requestNotify(); }
      const list = DB.get('todos', []);
      list.push({ id: DB.uid(), title, priority:'mid', dueDate, tag:'', done:false, reminder });
      DB.set('todos', list);
      let msg = '已添加：' + title;
      if(p.date) msg += '（'+fmtDate(dueDate)+'）';
      if(p.time) msg += ' ⏰'+p.time;
      toast(msg, 4000);
      refreshTodoView();
    }
  }, false);
}

// 表单内：语音录入标题（实时填入输入框，并自动识别日期/时间填入对应字段）
function voiceInputTitle(btn) {
  const el = document.getElementById('td_title');
  const hint = document.getElementById('td_title_hint');
  toggleSpeech(btn, {
    onInterim: (txt) => { if(el) el.value = txt; if(hint) hint.textContent = '🎤 聆听中…'; },
    onStop: (finalText) => {
      const raw = (finalText||'').trim();
      if(!el) return;
      const p = parseZhDateTime(raw);
      el.value = cleanTitle(raw, p);
      const dd = document.getElementById('td_dueDate'); if(dd && p.date) dd.value = p.date;
      const rm = document.getElementById('td_reminder'); if(rm && p.time) rm.value = (p.date || today()) + 'T' + p.time;
      if(hint) hint.textContent = (p.date ? ('日期 '+fmtDate(p.date)) : '') + (p.time ? (' · 闹钟 '+p.time) : '');
    }
  });
}

// 表单内：语音修改文字（支持“把X改成Y/将X改为Y/删除X/加上X/清空”等指令）
function voiceEditTitle(btn) {
  const el = document.getElementById('td_title');
  const hint = document.getElementById('td_title_hint');
  const cur = el ? el.value : '';
  toggleSpeech(btn, {
    onInterim: (txt) => { if(hint) hint.textContent = '指令：' + txt; },
    onStop: (finalText) => {
      const cmd = (finalText||'').trim();
      if(el && cmd) el.value = applyVoiceEdit(cmd, cur);
      if(hint) hint.textContent = cmd ? ('已应用指令：'+cmd) : '';
    }
  });
}

function applyVoiceEdit(cmd, current) {
  cmd = (cmd||'').trim();
  if(!cmd) return current;
  if(/(清空|清除|全部删)/.test(cmd)) return '';
  let m = cmd.match(/(把|将)\s*(.+?)\s*(改成|改为|换为|修改成|变成)\s*(.+)/);
  if(m) return (current||'').split(m[2].trim()).join(m[4].trim());
  m = cmd.match(/删除?\s*(.+)/);
  if(m) return (current||'').split(m[1].trim()).join('');
  m = cmd.match(/(加上|末尾加|后面加|前面加)\s*(.+)/);
  if(m) { const w = m[2].trim(); return /前面/.test(m[1]) ? w + (current||'') : (current||'') + w; }
  return current ? (current + ' ' + cmd) : cmd;
}

function financeForm() {

    <h3 class="modal-title">记一笔</h3>
    <div class="form-group"><label class="label">类型</label>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sm" style="flex:1;" id="ff_type_exp" onclick="financeType('expense')" >支出</button>
        <button class="btn btn-sm" style="flex:1;" id="ff_type_inc" onclick="financeType('income')">收入</button>
      </div>
      <input type="hidden" id="ff_type" value="expense">
    </div>
    <div class="form-group"><label class="label">金额</label><input type="number" step="0.01" class="input" id="ff_amount" placeholder="0.00"></div>
    <div class="form-group"><label class="label">分类</label>
      <select class="select" id="ff_category">
        <option value="餐饮">餐饮</option><option value="交通">交通</option><option value="购物">购物</option>
        <option value="娱乐">娱乐</option><option value="工资">工资</option><option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group"><label class="label">日期</label><input type="date" class="input" id="ff_date" value="${today()}"></div>
    <div class="form-group"><label class="label">备注</label><input type="text" class="input" id="ff_note" placeholder="可选"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveFinance()">保存</button>
    </div>`);
  financeType('expense');
}
function financeType(type) {
  document.getElementById('ff_type').value = type;
  const exp = document.getElementById('ff_type_exp'), inc = document.getElementById('ff_type_inc');
  if(type==='expense') { exp.classList.add('btn-primary'); exp.classList.remove('btn-secondary'); inc.classList.add('btn-secondary'); inc.classList.remove('btn-primary'); }
  else { inc.classList.add('btn-primary'); inc.classList.remove('btn-secondary'); exp.classList.add('btn-secondary'); exp.classList.remove('btn-primary'); }
}
function saveFinance() {
  const amount = parseFloat(document.getElementById('ff_amount').value);
  if(!amount || amount<=0) { toast('请输入有效金额'); return; }
  const rec = {
    id: DB.uid(), type: document.getElementById('ff_type').value, amount,
    category: document.getElementById('ff_category').value,
    date: document.getElementById('ff_date').value,
    note: document.getElementById('ff_note').value.trim()
  };
  const list = DB.get('finance',[]);
  list.push(rec); DB.set('finance', list);
  closeModal(); renderFinance(document.getElementById('mainContent')); updateStatusbar(); toast('已记录');
}
function delFinance(id) {
  if(!confirm('删除这条记录？')) return;
  DB.set('finance', DB.get('finance',[]).filter(x=>x.id!==id));
  renderFinance(document.getElementById('mainContent')); toast('已删除');
}

function renderDiary(main) {
  const diaries = DB.get('diaries', []).sort((a,b)=>b.date.localeCompare(a.date));

  main.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;">
      <div><h1 class="page-title">心情日记</h1><p class="page-subtitle">共 ${diaries.length} 篇日记</p></div>
      <button class="btn btn-primary" onclick="diaryForm()"><i class="fas fa-plus"></i> 写日记</button>
    </div>
    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin:0 0 12px;font-size:15px;">心情日历 (今年)</h3>
      <div id="heatmap" style="overflow-x:auto;"></div>
    </div>
    <h3 style="font-size:15px;margin:0 0 12px;">📖 日记列表</h3>
    <div>${diaryListHTML(diaries)}</div>`;

  renderHeatmap(diaries);
}
function renderHeatmap(diaries) {
  const year = new Date().getFullYear();
  const moodMap = {};
  diaries.forEach(d => { if(d.date.startsWith(year)) moodMap[d.date] = d.mood; });
  const weeks = 53; const days = 7;
  const start = new Date(year,0,1);
  const startDay = start.getDay();
  let html = '<div style="display:inline-grid;grid-template-columns:repeat(53, 15px);gap:2px;">';
  for(let w=0;w<weeks;w++) {
    for(let d=0;d<days;d++) {
      const dayIdx = w*7 + d - startDay;
      if(dayIdx<0 || dayIdx>365) { html += '<div style="width:13px;height:13px;"></div>'; continue; }
      const date = new Date(year,0,1+dayIdx);
      const ds = date.toISOString().slice(0,10);
      if(date.getFullYear()!==year) { html += '<div style="width:13px;height:13px;"></div>'; continue; }
      const mood = moodMap[ds];
      html += `<div class="heatmap-cell ${mood?'m'+mood:''}" title="${ds} ${mood?['😢','😞','😐','😄','😊'][mood-1]:''}"></div>`;
    }
  }
  html += '</div>';
  document.getElementById('heatmap').innerHTML = html;
}
function diaryListHTML(diaries) {
  if(!diaries.length) return `<div class="empty-state"><i class="fas fa-pen-fancy"></i><div>还没有日记，开始记录今天的心情吧</div></div>`;
  const emojis = ['😢','😞','😐','😄','😊'];
  return diaries.map(d => `
    <div class="list-item" style="align-items:flex-start;cursor:pointer;" onclick="diaryDetail('${d.id}')">
      <div style="font-size:28px;">${emojis[d.mood-1]}</div>
      <div style="flex:1;">
        <div style="font-weight:600;font-size:14px;">${d.title||'无标题'} <span style="font-size:12px;color:var(--text-secondary);font-weight:400;">· ${fmtDate(d.date)}</span></div>
        <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;line-height:1.5;">${(d.content||'').slice(0,100)}${d.content&&d.content.length>100?'...':''}</div>
      </div>
      <div class="item-actions">
        <button class="icon-btn" onclick="event.stopPropagation();diaryForm('${d.id}')"><i class="fas fa-edit"></i></button>
        <button class="icon-btn danger" onclick="event.stopPropagation();delDiary('${d.id}')"><i class="fas fa-trash"></i></button>
      </div>
    </div>`).join('');
}
function diaryForm(id) {
  const d = id ? DB.get('diaries',[]).find(x=>x.id===id) : {};
  const emojis = ['😢','😞','😐','😄','😊'];
  showModal(`
    <h3 class="modal-title">${id?'编辑':'写'}日记</h3>
    <div class="form-group"><label class="label">日期</label><input type="date" class="input" id="dr_date" value="${d.date||today()}"></div>
    <div class="form-group"><label class="label">心情</label>
      <div style="display:flex;gap:4px;" id="moodPicker">
        ${emojis.map((e,i)=>`<div class="mood-emoji ${d.mood===i+1?'selected':''}" data-mood="${i+1}" onclick="pickMood(${i+1})">${e}</div>`).join('')}
      </div>
      <input type="hidden" id="dr_mood" value="${d.mood||3}">
    </div>
    <div class="form-group"><label class="label">标题</label><input type="text" class="input" id="dr_title" value="${d.title||''}" placeholder="给今天起个标题"></div>
    <div class="form-group"><label class="label">正文</label><textarea class="textarea" id="dr_content" rows="6" placeholder="今天发生了什么...">${d.content||''}</textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveDiary('${id||''}')">保存</button>
    </div>`);
}
function pickMood(m) {
  document.getElementById('dr_mood').value = m;
  document.querySelectorAll('#moodPicker .mood-emoji').forEach((el,i) => {
    el.classList.toggle('selected', i+1===m);
  });
}
function saveDiary(id) {
  const rec = {
    date: document.getElementById('dr_date').value,
    mood: parseInt(document.getElementById('dr_mood').value),
    title: document.getElementById('dr_title').value.trim(),
    content: document.getElementById('dr_content').value.trim()
  };
  const list = DB.get('diaries',[]);
  if(id) { const i=list.findIndex(x=>x.id===id); if(i>=0) list[i]={...list[i],...rec}; }
  else { rec.id = DB.uid(); list.push(rec); }
  DB.set('diaries', list);
  closeModal(); renderDiary(document.getElementById('mainContent')); toast('日记已保存');
}
function diaryDetail(id) {
  const d = DB.get('diaries',[]).find(x=>x.id===id);
  if(!d) return;
  const emojis = ['😢','😞','😐','😄','😊'];
  showModal(`
    <h3 class="modal-title">${d.title||'无标题'}</h3>
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">${emojis[d.mood-1]} ${fmtDate(d.date)}</div>
    <div style="font-size:14px;line-height:1.8;white-space:pre-wrap;">${d.content||'(无内容)'}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:24px;">
      <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
      <button class="btn btn-primary" onclick="diaryForm('${d.id}')">编辑</button>
    </div>`);
}
function delDiary(id) {
  if(!confirm('删除这篇日记？')) return;
  DB.set('diaries', DB.get('diaries',[]).filter(x=>x.id!==id));
  renderDiary(document.getElementById('mainContent')); toast('已删除');
}

let bbcShowAll = false;
let currentBBC = 0;
function toggleAllBBC() {
  bbcShowAll = !bbcShowAll;
  document.getElementById('bbcList').style.display = bbcShowAll ? 'block' : 'none';
}
function playBBC(idx) {
  currentBBC = idx;
  const ep = BBC_EPISODES[idx];
  // 更新标签高亮
  document.querySelectorAll('#bbcTags button').forEach((b,i) => {
    if(i < 6) { b.classList.remove('btn-primary'); b.classList.add('btn-secondary'); }
  });
  const tag = document.getElementById('bbcTag'+idx);
  if(tag) { tag.classList.remove('btn-secondary'); tag.classList.add('btn-primary'); }

  // 渲染播放器
  const player = document.getElementById('bbcPlayer');
  player.innerHTML = `
    <div style="display:flex;gap:14px;align-items:flex-start;">
      <div style="width:80px;height:80px;border-radius:12px;background:linear-gradient(135deg,#ff9500,#ff6a00);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;">🎧</div>
      <div style="flex:1;">
        <div style="font-weight:700;font-size:15px;margin-bottom:4px;">${ep.title}</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;">BBC 6 Minute English · ${ep.dateStr}</div>
        <audio controls autoplay style="width:100%;height:36px;" src="${ep.mp3}"></audio>
      </div>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;">
      <button class="btn btn-sm btn-secondary" onclick="window.open('${ep.pageUrl}','_blank')"><i class="fas fa-book-open"></i> 查看中英文本</button>
      ${idx > 0 ? `<button class="btn btn-sm btn-secondary" onclick="playBBC(${idx-1})"><i class="fas fa-step-backward"></i> 上一期</button>` : ''}
      ${idx < BBC_EPISODES.length-1 ? `<button class="btn btn-sm btn-secondary" onclick="playBBC(${idx+1})"><i class="fas fa-step-forward"></i> 下一期</button>` : ''}
    </div>`;

  // 自动打卡通勤任务(BBC听力)
  const checks = DB.get('study_checks', {});
  const tc = checks[today()] || {};
  if(!tc.commute) {
    tc.commute = true; checks[today()] = tc; DB.set('study_checks', checks);
    updateStatusbar();
    toast('已自动打卡「听BBC」✅');
  }
}

function toggleStudy(taskId) {
  const checks = DB.get('study_checks', {});
  const tc = checks[today()] || {};
  tc[taskId] = !tc[taskId];
  checks[today()] = tc;
  DB.set('study_checks', checks);
  renderStudy(document.getElementById('mainContent'));
  updateStatusbar();
  if(tc[taskId]) toast('打卡成功！💪');
}

function openStudyApp(taskId) {
  const task = STUDY_TASKS.find(t => t.id === taskId);
  if(!task || !task.appUrl) return;
  // 尝试唤起 App
  window.location.href = task.appUrl;
  // 如果 App 没安装，1.5秒后提示
  setTimeout(() => {
    if(!document.hidden) {
      toast('未检测到墨墨App，请确认已安装。已自动打勾，可点击取消');
    }
  }, 1500);
  // 自动打勾
  const checks = DB.get('study_checks', {});
  const tc = checks[today()] || {};
  if(!tc[taskId]) {
    tc[taskId] = true;
    checks[today()] = tc;
    DB.set('study_checks', checks);
    setTimeout(() => { renderStudy(document.getElementById('mainContent')); updateStatusbar(); }, 100);
  }
}

function studyHistory() {
  const checks = DB.get('study_checks', {});
  const dates = Object.keys(checks).sort().reverse().slice(0, 30);
  showModal(`
    <h3 class="modal-title">📅 学习打卡历史</h3>
    ${dates.length ? dates.map(d => {
      const dc = checks[d] || {};
      const doneTasks = STUDY_TASKS.filter(t => dc[t.id]);
      const min = doneTasks.reduce((s,t)=>s+t.duration,0);
      return `
        <div class="list-item" style="align-items:flex-start;">
          <div style="flex:1;">
            <div style="font-weight:600;font-size:13px;">${fmtDate(d)} <span style="font-size:11px;color:var(--text-secondary);font-weight:400;">· ${doneTasks.length}/${STUDY_TASKS.length}项 · ${min}分钟</span></div>
            <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">

  closeModal(); renderTreasure(document.getElementById('mainContent')); toast('访谈已保存');
}

function delTreasure(id) {
  if(!confirm('删除这条访谈收藏？')) return;
  DB.set('treasure_items', DB.get('treasure_items',[]).filter(x=>x.id!==id));
  renderTreasure(document.getElementById('mainContent')); toast('已删除');
}

// ===================== RGP护理用品模块 =====================
// 各用品的开封有效期配置（毫秒）
const RGP_ITEMS = [
  { id:'peroxide',   name:'蓝澈双氧水',           icon:'🧴', duration: 90*24*60*60*1000,  unit:'90天' },
  { id:'care',       name:'护理液',               icon:'💧', duration: 90*24*60*60*1000,  unit:'90天' },
  { id:'saline',     name:'生理盐水',             icon:'🧂', duration: 24*60*60*1000,      unit:'24小时' },
  { id:'eyedrops',   name:'视倍佳润眼液/眼舒康润眼液', icon:'👁️', duration: 24*60*60*1000,      unit:'24小时' },
  { id:'abliquid',   name:'AB液',                icon:'⚗️', duration: 24*60*60*1000,      unit:'24小时' },
  { id:'abcase',     name:'AB液镜盒',             icon:'📦', duration: 180*24*60*60*1000,  unit:'半年' },
  { id:'sucker',     name:'吸棒',                icon:'🪠', duration: 90*24*60*60*1000,    unit:'3个月' }
];

function renderRGP(main) {
  const rgpData = DB.get('rgp_data', {});  // { peroxide: {openDate:'2026-08-01', batch:''}, ... }
  const now = Date.now();

  // 统计
  const expired = RGP_ITEMS.filter(it => { const d=rgpData[it.id]; if(!d||!d.openDate) return false; return now >= new Date(d.openDate).getTime()+it.duration; });
  const expiringSoon = RGP_ITEMS.filter(it => { const d=rgpData[it.id]; if(!d||!d.openDate) return false; const remain = new Date(d.openDate).getTime()+it.duration-now; return remain>0 && remain<7*24*60*60*1000; });
  const notOpened = RGP_ITEMS.filter(it => !rgpData[it.id] || !rgpData[it.id].openDate);

  main.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;">
      <div>
        <h1 class="page-title">RGP护理用品 👁️</h1>
        <p class="page-subtitle">追踪开封日期，提醒过期时间</p>
      </div>
    </div>

    <div class="grid-stats">
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--green)"><i class="fas fa-check-circle"></i></div>
        <div><div class="stat-value">${RGP_ITEMS.filter(it=>rgpData[it.id]&&rgpData[it.id].openDate).length}/${RGP_ITEMS.length}</div><div class="stat-label">已开封记录</div></div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--red)"><i class="fas fa-exclamation-triangle"></i></div>
        <div><div class="stat-value">${expired.length}</div><div class="stat-label">已过期</div></div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--orange)"><i class="fas fa-clock"></i></div>
        <div><div class="stat-value">${expiringSoon.length}</div><div class="stat-label">即将过期(7天内)</div></div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon" style="background:var(--text-tertiary)"><i class="fas fa-box"></i></div>
        <div><div class="stat-value">${notOpened.length}</div><div class="stat-label">未记录</div></div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 16px;font-size:15px;">📋 用品清单</h3>
      <div id="rgpList">
        ${RGP_ITEMS.map(it => {
          const d = rgpData[it.id];
          const openDate = d && d.openDate ? new Date(d.openDate) : null;
          const openTs = openDate ? openDate.getTime() : 0;
          const expireTs = openTs + it.duration;
          const remainMs = openDate ? expireTs - now : 0;
          let remainText, statusColor, statusBg, statusLabel;
          if(!openDate) {
            remainText='未记录'; statusColor='var(--text-tertiary)'; statusBg='var(--bg-hover)'; statusLabel='未开封';
          } else if(remainMs <= 0) {
            remainText='已过期'; statusColor='var(--red)'; statusBg='rgba(255,59,48,0.15)'; statusLabel='已过期';
          } else {
            const days = Math.floor(remainMs / (24*60*60*1000));
            const hours = Math.floor(remainMs / (60*60*1000));
            if(it.duration < 48*60*60*1000) {
              remainText = remainMs < 60*60*1000 ? `${Math.floor(remainMs/60000)}分钟` : `${hours}小时${Math.floor((remainMs%3600000)/60000)}分`;
            } else {
              remainText = `${days}天`;
            }
            if(days < 7 && it.duration >= 48*60*60*1000) {
              statusColor='var(--orange)'; statusBg='rgba(255,149,0,0.15)'; statusLabel='即将过期';
            } else if(it.duration < 48*60*60*1000 && hours < 6) {
              statusColor='var(--orange)'; statusBg='rgba(255,149,0,0.15)'; statusLabel='即将过期';
            } else {
              statusColor='var(--green)'; statusBg='rgba(52,199,89,0.15)'; statusLabel='使用中';
            }
          }
          return `
          <div class="list-item" style="align-items:center;cursor:pointer;" onclick="rgpForm('${it.id}')">
            <div style="width:44px;height:44px;border-radius:10px;background:${statusBg};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">${it.icon}</div>
            <div style="flex:1;">
              <div style="font-weight:600;font-size:14px;">${it.name}</div>
              <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">
                ${openDate ? `开封: ${fmtDate(d.openDate)} · 有效期: ${it.unit}` : `有效期: ${it.unit}（点击记录开封日期）`}
              </div>
            </div>
            <div style="text-align:right;flex-shrink:0;margin-right:8px;">
              <div style="font-size:14px;font-weight:700;color:${statusColor};">${remainText}</div>
              <div style="font-size:11px;color:${statusColor};background:${statusBg};padding:1px 8px;border-radius:10px;display:inline-block;margin-top:2px;">${statusLabel}</div>
            </div>
            <i class="fas fa-chevron-right" style="color:var(--text-tertiary);font-size:12px;"></i>
          </div>`;
        }).join('')}
      </div>
      <div style="margin-top:12px;padding:10px;background:var(--bg-hover);border-radius:8px;font-size:12px;color:var(--text-secondary);text-align:center;">
        点击任意用品可设置/修改开封日期 · 数据存储在本地浏览器
      </div>
    </div>`;
}

function rgpForm(itemId) {
  const item = RGP_ITEMS.find(it => it.id === itemId);
  const rgpData = DB.get('rgp_data', {});
  const d = rgpData[itemId] || {};
  showModal(`
    <h3 class="modal-title">${item.icon} ${item.name}</h3>
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">开封有效期: <b style="color:var(--accent);">${item.unit}</b></div>
    <div class="form-group"><label class="label">开封起始日期</label><input type="date" class="input" id="rgp_date" value="${d.openDate||today()}"></div>
    <div class="form-group"><label class="label">批次/备注(可选)</label><input type="text" class="input" id="rgp_batch" value="${d.batch||''}" placeholder="如 生产批号或备注"></div>
    ${d.openDate ? (() => {
      const remainMs = new Date(d.openDate).getTime() + item.duration - Date.now();
      if(remainMs <= 0) return `<div style="background:rgba(255,59,48,0.1);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--red);"><i class="fas fa-exclamation-triangle"></i> 此用品已过期 ${Math.floor(-remainMs/(24*60*60*1000))}天，建议更换</div>`;
      const days = Math.floor(remainMs/(24*60*60*1000));
      const hours = Math.floor(remainMs/(60*60*1000));
      const remainText = item.duration < 48*60*60*1000 ? `${hours}小时` : `${days}天`;
      return `<div style="background:rgba(52,199,89,0.1);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--green);"><i class="fas fa-check-circle"></i> 剩余有效期: ${remainText}</div>`;
    })() : ''}
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:18px;">
      ${d.openDate ? `<button class="btn btn-danger btn-sm" onclick="clearRGP('${itemId}')"><i class="fas fa-eraser"></i> 清除记录</button>` : ''}
      <div style="display:flex;gap:8px;margin-left:auto;">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveRGP('${itemId}')">保存</button>
      </div>
    </div>`);
}

function saveRGP(itemId) {
  const openDate = document.getElementById('rgp_date').value;
  const batch = document.getElementById('rgp_batch').value.trim();
  if(!openDate) { toast('请选择开封日期'); return; }
  const rgpData = DB.get('rgp_data', {});
  rgpData[itemId] = { openDate, batch };
  DB.set('rgp_data', rgpData);
  closeModal(); renderRGP(document.getElementById('mainContent')); toast('已保存');
}

function clearRGP(itemId) {
  if(!confirm('清除该用品的开封记录？')) return;
  const rgpData = DB.get('rgp_data', {});
  delete rgpData[itemId];
  DB.set('rgp_data', rgpData);
  closeModal(); renderRGP(document.getElementById('mainContent')); toast('已清除');
}

function saveSettings() {
  SETTINGS.name = document.getElementById('set_name').value.trim() || '我';
  SETTINGS.height = parseInt(document.getElementById('set_height').value) || 170;
  SETTINGS.theme = document.getElementById('set_theme').value;
  DB.set('settings', SETTINGS); applyTheme();
  closeModal(); navigate('todos'); toast('设置已保存');
}
function exportData() {
  const data = {};
  ['dance_records','body_records','books','todos','todo_trash','finance','diaries','study_checks','outfit_looks','family_moments','treasure_items','rgp_data','settings'].forEach(k => {
    data[k] = DB.get(k);
  });
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `工作台备份_${today()}.json`;
  a.click();
  toast('备份已导出');
}
function importData(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      Object.keys(data).forEach(k => { if(data[k]!==null) DB.set(k, data[k]); });
      toast('导入成功'); closeModal(); navigate('todos');
    } catch(err) { toast('导入失败：文件格式错误'); }
  };
  reader.readAsText(file);
}
function clearData() {
  if(!confirm('确定清空所有数据？此操作不可恢复！')) return;
  if(!confirm('再次确认：将删除全部记录！')) return;
  ['dance_records','body_records','books','todos','finance','diaries','study_checks','outfit_looks','family_moments','treasure_items','rgp_data'].forEach(k => DB.remove(k));
  closeModal(); navigate('todos'); toast('数据已清空');
}
